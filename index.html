<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typer — тренажёр печати</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>⌨️ Typer</h1>
      <button id="themeBtn" title="Сменить тему">🌙</button>
    </header>

    <div class="stats">
      <div class="stat"><span id="wpm">0</span><label>WPM</label></div>
      <div class="stat"><span id="acc">100%</span><label>Точность</label></div>
      <div class="stat"><span id="time">0s</span><label>Время</label></div>
      <div class="stat"><span id="best">0</span><label>Рекорд</label></div>
    </div>

    <div id="text" class="text"></div>

    <input id="input" type="text" autocomplete="off" autofocus placeholder="Начни печатать..." />

    <button id="restart" class="restart">↻ Заново</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
